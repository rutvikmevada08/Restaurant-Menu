<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Menu</title>

<style>
:root{
    --purple: purple;
    --yellow: yellow;
    --green: green;
    --white: white;
    --Rutvik: white;
    --border: black;
}

body{
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
}

.menu{
    width: 500px;
    margin: 20px auto;
}

.name{
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
}

.card{
    border: 2px solid var(--border);
    margin-bottom: 20px;
    background-color: white;
}

.title{
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.description{
    padding: 15px;
    font-size: 16px;
    background-color: var(--Rutvik)
}
.soft{
    background-color: var(--purple);
    color: var(--white);
}

.pizza{
    background-color: var(--yellow);
    color: white;
}

.burger{
    background-color: var(--green);
    color: var(--white);
}
</style>

</head>
<body>

<div class="menu">

    <div class="name">
        Mevada's Restaurant
    </div>

    <div class="card">
        <div class="title soft">Soft Drinks</div>
        <div class="description">
            Cold and refreshing drinks available in many flavors.
        </div>
    </div>

    <div class="card">
        <div class="title pizza">Pizza</div>
        <div class="description">
            Freshly baked pizzas with delicious toppings and cheese.
        </div>
    </div>

    <div class="card">
        <div class="title burger">Burger</div>
        <div class="description">
            Juicy burgers served with fresh vegetables and sauces.
        </div>
    </div>

</div>

</body>
</html>
